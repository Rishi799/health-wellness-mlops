# Publish only a trusted main commit whose full CI completed successfully.
# Rerun CI on main to republish; there is no unchecked manual CD shortcut.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rishi799/health-wellness-api
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Build, verify and publish image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Reject a stale release
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$RELEASE_SHA" = "$current" || { echo "Main advanced; release the newer tested commit instead."; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull the model with DVC
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pip install dvc==3.67.1
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull models/model.skops.dvc

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: BUILD_SHA=${{ env.RELEASE_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

      - name: Verify the exact image before publishing
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:$RELEASE_SHA"
          python -m scripts.smoke_test --base-url http://127.0.0.1:8000 --expected-commit "$RELEASE_SHA"
          docker exec api sh -c 'test "$(id -u)" -ne 0 && test ! -w /app/models/model.skops'

      - name: Publish the tested image
        run: |
          docker push "$IMAGE:$RELEASE_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy SHA image and verify Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: python -m scripts.render_deploy

      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Stop test container
        if: always()
        run: docker rm -f api || true
