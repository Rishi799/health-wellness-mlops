# Continuous integration: runs on every pull request to main and every push to main.
# Pulls the versioned data from DagsHub, checks the pipeline is up to date,
# validates the data and runs the full test suite.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DAGSHUB_USER   DagsHub username
#   DAGSHUB_TOKEN  DagsHub access token (never commit it)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test without downloading data or models
        run: python -m pytest --offline -q

  test:
    name: Data checks and tests
    needs: offline
    # Forks never receive DagsHub credentials. Their offline checks still run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DagsHub credentials for DVC
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USER" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::error::Repository secrets DAGSHUB_USER and DAGSHUB_TOKEN are not set."
            exit 1
          fi
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull data and models with DVC
        run: dvc pull

      - name: Rebuild and verify the locked pipeline
        run: |
          dvc repro --force
          git diff --exit-code -- dvc.lock reports/validation_2017-2018.json
          dvc status --json > /tmp/dvc-status.json
          python -c "import json; assert not json.load(open('/tmp/dvc-status.json')), 'DVC pipeline is dirty'"

      - name: Run tests
        run: pytest -q

      # Blocks the merge if the champion model breaks the team's quality rules
      # (ROC-AUC >= 0.80, recall >= 0.75, beats Dummy by >= 0.20, no leakage,
      # input contract). Brier score and subgroup recall are warnings only.
      - name: Model quality gate
        run: python -m src.models.quality_gate

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-quality-report
          path: |
            reports/model_quality.json
            reports/figures/calibration.png
          if-no-files-found: warn

  # Builds the real Docker image, starts it and makes one prediction (smoke test),
  # so a broken image is caught before merge. Runs only after the tests pass.
  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull the model with DVC
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pip install dvc==3.67.1
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull models/model.skops.dvc

      - name: Build image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t health-api .

      - name: Start container and check /health and /predict
        run: |
          docker run -d --name api -p 8000:8000 health-api
          python -m scripts.smoke_test --base-url http://127.0.0.1:8000 --expected-commit "$GITHUB_SHA"
          docker exec api sh -c 'test "$(id -u)" -ne 0 && test ! -w /app/models/model.skops'
          docker images health-api --format "Image size: {{.Size}}"

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

      - name: Stop test container
        if: always()
        run: docker rm -f api || true
