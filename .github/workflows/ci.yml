# Continuous integration: runs on every pull request to main and every push to main.
# Pulls the versioned data from DagsHub, checks the pipeline is up to date,
# validates the data and runs the full test suite.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DAGSHUB_USER   DagsHub username
#   DAGSHUB_TOKEN  DagsHub access token (never commit it)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Data checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DagsHub credentials for DVC
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USER" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::error::Repository secrets DAGSHUB_USER and DAGSHUB_TOKEN are not set."
            exit 1
          fi
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull data and models with DVC
        run: dvc pull

      # TEMPORARY: dvc.lock was written on Windows, so its code hashes are for CRLF
      # files and differ from this Linux (LF) checkout. Until the line-ending fix
      # (.gitattributes + regenerated dvc.lock, Person 2) is merged, this step only
      # reports. Remove `continue-on-error` after that fix.
      - name: Check the pipeline is up to date
        continue-on-error: true
        run: |
          dvc status
          dvc status | grep -q "Data and pipelines are up to date"

      - name: Validate data (pandera)
        run: python -m src.data.validate --cycle 2017-2018

      - name: Run tests
        run: pytest -q
